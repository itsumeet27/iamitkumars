name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FTP secrets
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Hostinger FTP secrets are not set, so this push was not uploaded."
            echo "Add FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD under Settings → Secrets and variables → Actions."
          fi

      - name: Prepare site bundle
        if: steps.ftp.outputs.configured == 'true'
        run: |
          mkdir -p _site
          cp index.html 404.html .htaccess _site/
          cp -r about research publications contact css js assets _site/

      - name: Find public_html two folders down
        id: remote
        if: steps.ftp.outputs.configured == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 scripts/test_resolve_ftp_dir.py
          dir=$(python3 scripts/resolve_ftp_dir.py)
          echo "remote_dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload to public_html
        if: steps.ftp.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./_site/
          server-dir: ${{ steps.remote.outputs.remote_dir }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
